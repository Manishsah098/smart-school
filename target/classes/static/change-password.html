<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSchool — Change Password</title>
  <meta name="description" content="Mandatory first-login password change for SmartSchool." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .req-item { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--clr-text-faint); margin-bottom: .25rem; }
    .req-item.met  { color: var(--clr-success); }
    .req-item.fail { color: var(--clr-danger); }
    .req-item i { font-size: .9rem; }
    .strength-bar-wrap { height: 4px; background: var(--clr-surface-2); border-radius: 99px; overflow: hidden; margin-bottom: .5rem; }
    .strength-bar { height: 100%; border-radius: 99px; width: 0; transition: width .3s, background .3s; }
    .input-group-ss { position: relative; }
    .password-toggle {
      position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--clr-text-faint); cursor: pointer; font-size: 1rem;
    }
    .first-login-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3);
      color: #fbbf24; border-radius: 99px; padding: .3rem .9rem; font-size: .78rem; font-weight: 600;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="login-bg">

<div class="login-card" style="max-width:460px;">
  <div class="login-logo" style="background:linear-gradient(135deg,#f59e0b,#d97706);">
    <i class="bi bi-key-fill" style="font-size:1.3rem;color:#fff;"></i>
  </div>
  <h1 class="login-title">Set Your Password</h1>
  <p class="login-sub">Your temporary password must be changed before you continue.</p>
  <div class="first-login-badge"><i class="bi bi-exclamation-triangle-fill"></i> First Login Detected</div>

  <div id="change-error" class="alert-ss danger mb-3" style="display:none;">
    <i class="bi bi-exclamation-circle-fill"></i>
    <span id="change-error-msg"></span>
  </div>
  <div id="change-success" class="alert-ss success mb-3" style="display:none;">
    <i class="bi bi-check-circle-fill"></i>
    <span>Password updated successfully! Redirecting…</span>
  </div>

  <form id="change-form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="current-pwd">Temporary / Current Password</label>
      <div class="input-group-ss">
        <input type="password" id="current-pwd" class="form-input"
               placeholder="Your current / temporary password"
               autocomplete="current-password" required style="padding-right:2.75rem;" />
        <button type="button" class="password-toggle" onclick="togglePwd('current-pwd','icon-curr')">
          <i class="bi bi-eye" id="icon-curr"></i>
        </button>
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label" for="new-pwd">New Password</label>
      <div class="input-group-ss">
        <input type="password" id="new-pwd" class="form-input"
               placeholder="Choose a strong new password"
               autocomplete="new-password" required style="padding-right:2.75rem;" oninput="checkStrength(this.value)" />
        <button type="button" class="password-toggle" onclick="togglePwd('new-pwd','icon-new')">
          <i class="bi bi-eye" id="icon-new"></i>
        </button>
      </div>
    </div>

    <!-- Strength bar -->
    <div class="strength-bar-wrap mb-2"><div class="strength-bar" id="strength-bar"></div></div>

    <!-- Requirements -->
    <div class="mb-3" id="requirements">
      <div class="req-item" id="req-len"><i class="bi bi-circle"></i> At least 8 characters</div>
      <div class="req-item" id="req-upper"><i class="bi bi-circle"></i> At least one uppercase letter</div>
      <div class="req-item" id="req-lower"><i class="bi bi-circle"></i> At least one lowercase letter</div>
      <div class="req-item" id="req-digit"><i class="bi bi-circle"></i> At least one number</div>
      <div class="req-item" id="req-special"><i class="bi bi-circle"></i> At least one special character</div>
    </div>

    <div class="mb-4">
      <label class="form-label" for="confirm-pwd">Confirm New Password</label>
      <div class="input-group-ss">
        <input type="password" id="confirm-pwd" class="form-input"
               placeholder="Re-enter your new password"
               autocomplete="new-password" required style="padding-right:2.75rem;" />
        <button type="button" class="password-toggle" onclick="togglePwd('confirm-pwd','icon-conf')">
          <i class="bi bi-eye" id="icon-conf"></i>
        </button>
      </div>
    </div>

    <button type="submit" id="submit-btn" class="btn-primary-ss w-100 justify-content-center" style="font-size:1rem;padding:.8rem;">
      <i class="bi bi-check2-circle"></i> Update Password
    </button>
  </form>
</div>

<script src="/js/api.js"></script>
<script src="/js/pwa.js"></script>
<script>
  // Guard: must be logged in
  if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; }

  function togglePwd(inputId, iconId) {
    const inp = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
  }

  const rules = [
    { id: 'req-len',     test: v => v.length >= 8 },
    { id: 'req-upper',   test: v => /[A-Z]/.test(v) },
    { id: 'req-lower',   test: v => /[a-z]/.test(v) },
    { id: 'req-digit',   test: v => /\d/.test(v) },
    { id: 'req-special', test: v => /[^A-Za-z\d]/.test(v) },
  ];

  function checkStrength(val) {
    let score = 0;
    rules.forEach(r => {
      const met = r.test(val);
      if (met) score++;
      const el = document.getElementById(r.id);
      el.className = 'req-item ' + (met ? 'met' : val.length ? 'fail' : '');
      el.querySelector('i').className = 'bi ' + (met ? 'bi-check-circle-fill' : val.length ? 'bi-x-circle' : 'bi-circle');
    });
    const bar = document.getElementById('strength-bar');
    const colors = ['#ef4444','#ef4444','#f59e0b','#10b981','#10b981'];
    bar.style.width = (score * 20) + '%';
    bar.style.background = colors[score - 1] || '#334155';
  }

  document.getElementById('change-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errDiv = document.getElementById('change-error');
    const errMsg = document.getElementById('change-error-msg');
    const succDiv = document.getElementById('change-success');

    const currentPwd = document.getElementById('current-pwd').value;
    const newPwd     = document.getElementById('new-pwd').value;
    const confirmPwd = document.getElementById('confirm-pwd').value;

    errDiv.style.display = 'none';
    succDiv.style.display = 'none';

    if (!currentPwd || !newPwd || !confirmPwd) {
      errMsg.textContent = 'Please fill in all fields.'; errDiv.style.display = 'flex'; return;
    }
    if (newPwd !== confirmPwd) {
      errMsg.textContent = 'New passwords do not match.'; errDiv.style.display = 'flex'; return;
    }
    if (!rules.every(r => r.test(newPwd))) {
      errMsg.textContent = 'New password does not meet all requirements.'; errDiv.style.display = 'flex'; return;
    }

    UI.btnLoading(btn, true);
    const res = await AuthAPI.changePassword(currentPwd, newPwd, confirmPwd);
    UI.btnLoading(btn, false);

    if (!res.success) {
      errMsg.textContent = res.message || 'Failed to change password.'; errDiv.style.display = 'flex'; return;
    }

    // Update stored user (firstLogin flag cleared)
    const user = Auth.getUser();
    if (user) { user.firstLogin = false; Auth.setUser(user); }

    succDiv.style.display = 'flex';
    setTimeout(() => Auth.redirectToDashboard(user?.role), 1500);
  });
</script>
</body>
</html>
