<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchool — Offline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card bg-surface border-secondary p-4 text-center shadow-lg" style="max-width: 480px;">
    <div class="mb-3 text-warning">
      <i class="bi bi-wifi-off display-1"></i>
    </div>
    <h2 class="h4 fw-bold mb-2">You are currently offline</h2>
    <p class="text-secondary small mb-4">
      Some school information and dynamic updates may not be available until your internet connection is restored.
      Unsafe offline academic record modifications are disabled for data integrity.
    </p>
    <button onclick="window.location.reload()" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
      <i class="bi bi-arrow-clockwise"></i> Retry Connection
    </button>
  </div>
</body>
</html>
