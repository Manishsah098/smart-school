<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSchool — Sign In</title>
  <meta name="description" content="Sign in to SmartSchool — your school management system." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .password-toggle {
      position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--clr-text-faint); cursor: pointer; font-size: 1rem;
      transition: color .2s;
    }
    .password-toggle:hover { color: var(--clr-text); }
    .input-group-ss { position: relative; }
    .role-tabs { display: flex; gap: .5rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .role-tab {
      flex: 1; min-width: 80px;
      padding: .5rem .5rem;
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius-sm);
      background: var(--clr-surface-2);
      color: var(--clr-text-muted);
      font-size: .78rem; font-weight: 600; text-align: center;
      cursor: pointer; transition: all .2s;
    }
    .role-tab i { display: block; font-size: 1.2rem; margin-bottom: .2rem; }
    .role-tab.active { border-color: var(--clr-primary); background: rgba(79,70,229,.15); color: var(--clr-primary-h); }
    .back-link { display: inline-flex; align-items: center; gap: .4rem; color: var(--clr-text-muted); font-size: .83rem; margin-bottom: 1.5rem; }
    .back-link:hover { color: var(--clr-text); }
    .controlled-note {
      background: rgba(99,102,241,.08);
      border: 1px solid rgba(99,102,241,.2);
      border-radius: var(--radius-sm);
      padding: .65rem .9rem;
      font-size: .78rem;
      color: #a5b4fc;
      margin-top: 1.25rem;
      display: flex; align-items: flex-start; gap: .5rem;
    }
  </style>
</head>
<body class="login-bg">

<div class="login-card">
  <a href="/index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to portal</a>

  <div class="login-logo">SS</div>
  <h1 class="login-title">Welcome Back</h1>
  <p class="login-sub">Sign in to your SmartSchool account</p>

  <!-- Role selection tabs (visual only — actual role determined by credentials) -->
  <div class="role-tabs" id="role-tabs">
    <div class="role-tab active" data-role="admin" onclick="selectRole('admin', this)">
      <i class="bi bi-shield-lock-fill"></i>Admin
    </div>
    <div class="role-tab" data-role="teacher" onclick="selectRole('teacher', this)">
      <i class="bi bi-person-video3"></i>Teacher
    </div>
    <div class="role-tab" data-role="student" onclick="selectRole('student', this)">
      <i class="bi bi-mortarboard-fill"></i>Student
    </div>
    <div class="role-tab" data-role="parent" onclick="selectRole('parent', this)">
      <i class="bi bi-people-fill"></i>Parent
    </div>
  </div>

  <!-- Error alert -->
  <div id="login-error" class="alert-ss danger mb-4" style="display:none;">
    <i class="bi bi-exclamation-circle-fill"></i>
    <span id="login-error-msg">Invalid credentials. Please try again.</span>
  </div>

  <form id="login-form" novalidate>
    <div class="mb-4">
      <label class="form-label" for="username">Username / ID</label>
      <input type="text" id="username" name="username" class="form-input"
        placeholder="Enter your username or ID" autocomplete="username" autofocus required />
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <div class="input-group-ss">
        <input type="password" id="password" name="password" class="form-input"
          placeholder="Enter your password" autocomplete="current-password" required style="padding-right:2.75rem;" />
        <button type="button" class="password-toggle" id="pwd-toggle" aria-label="Toggle password visibility">
          <i class="bi bi-eye" id="pwd-icon"></i>
        </button>
      </div>
    </div>

    <button type="submit" id="login-btn" class="btn-primary-ss w-100 justify-content-center" style="font-size:1rem;padding:.8rem;">
      <i class="bi bi-box-arrow-in-right"></i> Sign In
    </button>
  </form>

  <!-- Controlled-access note (NO Forgot Password) -->
  <div class="controlled-note">
    <i class="bi bi-info-circle-fill" style="margin-top:.05rem;flex-shrink:0;"></i>
    <span>Access is managed by your school administrator. Contact the school office if you need your credentials reset.</span>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/pwa.js"></script>
<script>
  // Pre-select role from query param (e.g. /login.html?role=teacher)
  const params = new URLSearchParams(location.search);
  const preRole = params.get('role');
  if (preRole) {
    document.querySelectorAll('.role-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.role === preRole);
    });
  }

  // If already logged in, redirect
  if (Auth.isLoggedIn()) {
    const u = Auth.getUser();
    if (u?.role) Auth.redirectToDashboard(u.role);
  }

  function selectRole(role, el) {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  // Password visibility toggle
  document.getElementById('pwd-toggle').addEventListener('click', () => {
    const inp = document.getElementById('password');
    const icon = document.getElementById('pwd-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });

  // Login form submit
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errDiv  = document.getElementById('login-error');
    const errMsg  = document.getElementById('login-error-msg');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      errMsg.textContent = 'Please enter both username and password.';
      errDiv.style.display = 'flex'; return;
    }
    errDiv.style.display = 'none';
    UI.btnLoading(btn, true);

    const res = await AuthAPI.login(username, password);
    UI.btnLoading(btn, false);

    if (!res.success) {
      errMsg.textContent = res.message || 'Invalid credentials. Please try again.';
      errDiv.style.display = 'flex';
      document.getElementById('password').value = '';
      return;
    }

    // Save token and user
    Auth.setToken(res.data.token);
    Auth.setUser({
      username: res.data.username,
      role: res.data.role,
      displayName: res.data.displayName,
      firstLogin: res.data.firstLogin
    });

    // Mandatory first-login password change
    if (res.data.firstLogin) {
      window.location.href = '/change-password.html';
      return;
    }

    // Redirect to role dashboard
    Auth.redirectToDashboard(res.data.role);
  });
</script>
</body>
</html>
