# ===================================================================
# SmartSchool Application Configuration
# ===================================================================
spring.application.name=smart-school
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Embedded persistent H2 default, MySQL optional via DB_URL)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/smart_school_db;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (for debugging/inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
# Minimum 256-bit secure secret key
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours in milliseconds
jwt.expiration=86400000

# -------------------------------------------------------------------
# Initial Admin Setup Configuration
# -------------------------------------------------------------------
app.init.admin.username=admin
app.init.admin.password=Admin@123
app.init.admin.email=admin@smartschool.edu
app.init.seed-sample-data=true

# -------------------------------------------------------------------
# PWA & Web Resource Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.smartschool=INFO
logging.level.org.springframework.security=WARN
