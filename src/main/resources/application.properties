# ===================================================================
# SmartSchool Application Configuration
# ===================================================================
spring.application.name=smart-school
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MySQL default with automatic failover to H2)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_school?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
# Minimum 256-bit secure secret key
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours in milliseconds
jwt.expiration=86400000

# -------------------------------------------------------------------
# Initial Admin Setup Configuration
# -------------------------------------------------------------------
app.init.admin.username=admin
app.init.admin.password=Admin@123
app.init.admin.email=admin@smartschool.edu
app.init.seed-sample-data=true

# -------------------------------------------------------------------
# PWA & Web Resource Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.smartschool=INFO
logging.level.org.springframework.security=WARN
